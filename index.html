<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumina V8</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Cyberpunk & Hacker Theme */
        :root {
            --neon-green: #00ff41;
            --neon-blue: #00f3ff;
            --dark-bg: #050505;
            --panel-bg: rgba(13, 17, 23, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; /* Hide scrollbars */
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Matrix Rain Canvas Background */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3; /* Subtle background */
        }

        /* Scanline Effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* Main Container */
        .dashboard-container {
            width: 90%;
            max-width: 400px;
            background: var(--panel-bg);
            border: 1px solid var(--neon-green);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2), inset 0 0 20px rgba(0, 255, 65, 0.1);
            backdrop-filter: blur(10px);
            z-index: 2;
        }

        /* Glitch Title Effect */
        .glitch {
            font-size: 28px;
            font-weight: bold;
            text-transform: uppercase;
            position: relative;
            text-shadow: 0 0 10px var(--neon-green);
            color: var(--neon-green);
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--panel-bg);
        }
        
        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 red;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }
        
        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 var(--neon-blue);
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(12px, 9999px, 86px, 0); }
            20% { clip: rect(62px, 9999px, 12px, 0); }
            40% { clip: rect(33px, 9999px, 99px, 0); }
            60% { clip: rect(89px, 9999px, 44px, 0); }
            80% { clip: rect(55px, 9999px, 77px, 0); }
            100% { clip: rect(22px, 9999px, 33px, 0); }
        }
        
        @keyframes glitch-anim-2 {
            0% { clip: rect(65px, 9999px, 100px, 0); }
            20% { clip: rect(12px, 9999px, 54px, 0); }
            40% { clip: rect(88px, 9999px, 23px, 0); }
            60% { clip: rect(34px, 9999px, 67px, 0); }
            80% { clip: rect(91px, 9999px, 11px, 0); }
            100% { clip: rect(43px, 9999px, 82px, 0); }
        }

        .subtitle {
            text-align: center;
            color: var(--neon-blue);
            font-size: 12px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Neumorphic/Neon Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .cyber-btn {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 15px;
            font-size: 14px;
            font-weight: bold;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cyber-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.2), transparent);
            transition: all 0.4s;
        }

        .cyber-btn:hover::before, .cyber-btn:active::before {
            left: 100%;
        }

        .cyber-btn:active {
            background: rgba(0, 243, 255, 0.1);
            box-shadow: 0 0 15px var(--neon-blue);
            transform: scale(0.98);
        }

        .btn-icon {
            font-size: 18px;
        }

        /* Terminal Output Box */
        .terminal-window {
            margin-top: 25px;
            background: #000;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            height: 100px;
            overflow-y: auto;
            font-size: 12px;
            color: #ccc;
            position: relative;
        }

        .terminal-header {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }

        .terminal-text {
            font-family: monospace;
            white-space: pre-wrap;
            line-height: 1.4;
        }
        
        /* Blinking Cursor */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background-color: var(--neon-green);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        @keyframes blink { 50% { opacity: 0; } }

    </style>
</head>
<body>

    <!-- Matrix Background -->
    <canvas id="matrix-canvas"></canvas>
    
    <!-- CRT Scanlines -->
    <div class="scanlines"></div>

    <div class="dashboard-container">
        <div class="glitch" data-text="LUMINA V8">LUMINA V8</div>
        <div class="subtitle">Apex Predator Protocol</div>

        <div class="btn-group">
            <button class="cyber-btn" onclick="sendAction('status')">
                <span>System Stats</span>
                <span class="btn-icon">📊</span>
            </button>
            <button class="cyber-btn" onclick="sendAction('plugins')">
                <span>Plugin Manager</span>
                <span class="btn-icon">🧩</span>
            </button>
            <button class="cyber-btn" onclick="sendAction('terminal')">
                <span>Terminal Mode</span>
                <span class="btn-icon">💻</span>
            </button>
        </div>

        <div class="terminal-window">
            <div class="terminal-header">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="terminal-text" id="output">root@lumina:~# Waiting for input<span class="cursor"></span></div>
        </div>
    </div>

    <script>
        // --- MATRIX RAIN ANIMATION ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff41';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);

        // --- TELEGRAM WEBAPP LOGIC ---
        let tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.ready();
        
        // Theme integration
        tg.setHeaderColor('#050505');

        function sendAction(action) {
            let out = document.getElementById('output');
            out.innerHTML = "> Executing: " + action + "...<span class='cursor'></span>";
            
            // Send data back to the bot
            tg.sendData(JSON.stringify({ action: action }));
            
            // Close web app after sending
            setTimeout(() => { tg.close(); }, 600);
        }
    </script>
</body>
</html>
