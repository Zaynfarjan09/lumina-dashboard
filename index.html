<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumina V8</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        :root { --neon-green: #00ff41; --neon-blue: #00f3ff; --dark-bg: #050505; --panel-bg: rgba(13, 17, 23, 0.85); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--dark-bg); color: var(--neon-green); font-family: 'Courier New', Courier, monospace; overflow-y: auto; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 0; position: relative; perspective: 1000px;}
        #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; opacity: 0.2; }
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2)); background-size: 100% 4px; pointer-events: none; z-index: 10; }
        
        .dashboard-container { width: 90%; max-width: 400px; background: var(--panel-bg); border: 1px solid var(--neon-green); border-radius: 12px; padding: 20px; box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); backdrop-filter: blur(10px); z-index: 2; margin-bottom: 20px; }
        .glitch { font-size: 28px; font-weight: bold; text-transform: uppercase; text-shadow: 0 0 10px var(--neon-green); color: var(--neon-green); text-align: center; margin-bottom: 5px; letter-spacing: 2px; }
        .subtitle { text-align: center; color: var(--neon-blue); font-size: 12px; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        
        .btn-group { display: flex; flex-direction: column; gap: 15px; }
        .cyber-btn { background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 15px; font-size: 14px; font-weight: bold; font-family: inherit; text-transform: uppercase; cursor: pointer; transition: all 0.3s; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .cyber-btn:active { background: rgba(0, 243, 255, 0.1); box-shadow: 0 0 15px var(--neon-blue); transform: scale(0.98); }
        
        .input-group { margin-top: 15px; display: flex; gap: 10px; }
        .cyber-input { flex: 1; background: #000; border: 1px solid var(--neon-blue); color: var(--neon-green); padding: 10px; font-family: inherit; font-size: 14px; outline: none; }
        .cyber-input::placeholder { color: rgba(0, 243, 255, 0.5); }
        .send-btn { background: var(--neon-blue); color: #000; border: none; padding: 10px 15px; font-weight: bold; cursor: pointer; }

        .terminal-window { margin-top: 25px; background: #000; border: 1px solid #333; border-radius: 6px; padding: 10px; height: 100px; overflow-y: auto; font-size: 12px; color: #ccc; }
        .terminal-text { font-family: monospace; white-space: pre-wrap; }
        
        /* 🔥 8D 3D-Looking Graph Container */
        .graph-wrapper {
            width: 100%; height: 400px; margin-top: 20px;
            background: radial-gradient(circle at center, #061206 0%, #000 100%);
            border: 1px solid var(--neon-green); border-radius: 6px;
            box-shadow: inset 0 0 30px rgba(0, 255, 65, 0.1);
            position: relative; overflow: hidden;
            transform: rotateX(15deg) rotateY(-5deg) scale(1.02); /* 3D Tilt */
            transform-style: preserve-3d;
        }
        
        /* Radar Sweep Effect */
        .radar-sweep {
            position: absolute; top: 50%; left: 50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent 0deg, transparent 270deg, rgba(0, 255, 65, 0.1) 360deg);
            border-radius: 50%; transform: translate(-50%, -50%);
            animation: spin 4s linear infinite; pointer-events: none; z-index: 1;
        }
        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        
        #network-container { width: 100%; height: 100%; position: relative; z-index: 2; }
        .back-btn { display: block; background: transparent; border: 1px dashed var(--neon-blue); color: var(--neon-blue); margin-top: 15px; width: 100%; padding: 10px; cursor: pointer; font-family: inherit;}
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    <div class="scanlines"></div>
    <div class="dashboard-container" id="main-panel">
        <div class="glitch">LUMINA V8</div>
        <div class="subtitle">Apex Predator Protocol</div>
        <div class="btn-group" id="btn-group">
            <button class="cyber-btn" onclick="selectAction('status')"><span>System Stats</span><span>📊</span></button>
            <button class="cyber-btn" onclick="selectAction('plugins')"><span>Plugin Manager</span><span>🧩</span></button>
            <button class="cyber-btn" onclick="showGraphPanel()"><span>OSINT Graph</span><span>🕸️</span></button>
        </div>
        <div class="input-group" id="term-group">
            <input type="text" id="terminalInput" class="cyber-input" placeholder="Enter shell command...">
            <button class="send-btn" onclick="sendTerminal()">RUN</button>
        </div>
        <div class="terminal-window">
            <div class="terminal-text" id="output">root@lumina:~# Ready...</div>
        </div>
    </div>
    
    <div class="dashboard-container" id="graph-panel" style="display: none;">
        <div class="glitch" style="font-size: 18px; margin-bottom: 15px;" id="graph-title">OSINT NETWORK</div>
        
        <div class="graph-wrapper">
            <div class="radar-sweep"></div>
            <div id="network-container"></div>
        </div>
        
        <button class="back-btn" onclick="hideGraphPanel()">⬅ BACK TO MENU</button>
    </div>
    
    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
        const fontSize = 16; const columns = canvas.width / fontSize; const drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;
        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff41'; ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);
        
        let tg = window.Telegram.WebApp;
        tg.expand(); tg.ready();
        let network = null;

        async function showGraphPanel() {
            document.getElementById('main-panel').style.display = 'none';
            document.getElementById('graph-panel').style.display = 'block';
            const urlParams = new URLSearchParams(window.location.search);
            const target = urlParams.get('target');
            const b64Data = urlParams.get('data');
            
            if(target) document.getElementById('graph-title').innerText = `TARGET: ${target}`;
            
            if (b64Data) {
                try {
                    const binaryString = atob(b64Data.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                    
                    const ds = new DecompressionStream('deflate');
                    const decompressedStream = new Blob([bytes]).stream().pipeThrough(ds);
                    const text = await new Response(decompressedStream).text();
                    const graphData = JSON.parse(text);
                    
                    drawGraph(graphData);
                } catch(e) {
                    drawMockGraph();
                }
            } else {
                drawMockGraph();
            }
        }

        function hideGraphPanel() {
            document.getElementById('main-panel').style.display = 'block';
            document.getElementById('graph-panel').style.display = 'none';
        }

        function drawGraph(data) {
            var container = document.getElementById('network-container');
            var nodesData = new vis.DataSet(data.nodes);
            var edgesData = new vis.DataSet(data.edges.map(e => ({...e, smooth: {type: 'curvedCW', roundness: 0.4}})));
            
            var options = {
                nodes: {
                    shape: 'dot',
                    font: { size: 12, color: '#fff', face: 'monospace', strokeWidth: 3, strokeColor: '#000' },
                    borderWidth: 4,
                    shadow: { enabled: true, color: 'rgba(0, 255, 65, 0.8)', size: 20, x: 0, y: 0 } // Glowing Nodes
                },
                edges: {
                    arrows: { to: { enabled: true, scaleFactor: 1.5 } },
                    color: { color: 'rgba(0, 243, 255, 0.4)', highlight: '#00ff41' },
                    width: 1.5,
                    selectionWidth: 2,
                    shadow: { enabled: true, color: 'rgba(0, 243, 255, 0.5)', size: 10 }
                },
                physics: {
                    enabled: true,
                    barnesHut: { gravitationalConstant: -5000, centralGravity: 0.1, springLength: 180, springConstant: 0.04, damping: 0.09 },
                    stabilization: { iterations: 100 }
                },
                interaction: { hover: true }
            };
            
            if(network) network.destroy();
            network = new vis.Network(container, {nodes: nodesData, edges: edgesData}, options);
            network.fit();
        }

        function drawMockGraph() {
            const mock = {
                nodes: [
                    { id: 'google.com', label: 'google.com', group: 'domain', color: { border: '#00ff41' }, size: 25 },
                    { id: '142.250.190.46', label: '142.250.190.46\n(USA)', group: 'ip', color: { border: '#00f3ff' }, size: 20 },
                    { id: 'geo_USA', label: '📍 USA', group: 'geo', color: { border: '#ff5f56' }, size: 18 }
                ],
                edges: [
                    { from: 'google.com', to: '142.250.190.46', label: 'resolves' },
                    { from: '142.250.190.46', to: 'geo_USA', label: 'located' }
                ]
            };
            drawGraph(mock);
        }

        function selectAction(action) {
            let out = document.getElementById('output');
            out.innerHTML = "> Selected: " + action + "\n> Click CONFIRM below to send.";
            tg.MainButton.setText("CONFIRM " + action.toUpperCase());
            tg.MainButton.show();
        }
        function sendTerminal() {
            let cmd = document.getElementById('terminalInput').value;
            if (!cmd) return;
            tg.MainButton.setText("SEND COMMAND");
            tg.MainButton.show();
            tg.MainButton.onClick(function() {
                tg.sendData(JSON.stringify({ action: "terminal", cmd: cmd }));
                setTimeout(() => { tg.close(); }, 500);
            });
        }
        tg.MainButton.onClick(function() {
            if (tg.MainButton.text.includes("CONFIRM")) {
                let action = tg.MainButton.text.replace("CONFIRM ", "").toLowerCase();
                tg.sendData(JSON.stringify({ action: action }));
                setTimeout(() => { tg.close(); }, 500);
            }
        });
    </script>
</body>
</html>
